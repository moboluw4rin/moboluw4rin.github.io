<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex">
        <title>Page not found | Mobolu Olowoyeye</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
        <style>
            :root {
                --bg: #0D0D0D;
                --ink: #FFFFFF;
                --ink-soft: #A3A3A3;
                --accent: #FFC700;
                --accent-2: #FF3B5C;
                --line: #262626;
                --max-width: 720px;
            }

            * { box-sizing: border-box; }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                background: var(--bg);
                color: var(--ink);
                font-family: 'Helvetica Neue', Arial, sans-serif;
                font-size: 17px;
                line-height: 1.6;
                -webkit-font-smoothing: antialiased;
            }

            a {
                color: var(--accent-2);
                text-decoration: none;
                border-bottom: 1px solid transparent;
                transition: border-color 0.15s ease;
            }

            a:hover, a:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 3px;
            }

            .wrap {
                max-width: var(--max-width);
                margin: 0 auto;
                padding: 0 24px;
                width: 100%;
            }

            header {
                padding: 28px 0;
                border-bottom: 1px solid var(--line);
            }

            .site-name {
                font-size: 19px;
            }

            .site-name a {
                color: var(--ink);
            }

            main {
                flex: 1;
                display: flex;
                align-items: center;
                padding: 72px 0;
            }

            .code {
                margin: 0 0 12px;
                font-size: clamp(64px, 14vw, 120px);
                font-weight: 700;
                line-height: 1;
                letter-spacing: -0.02em;
                color: var(--accent);
            }

            h1 {
                margin: 0;
                font-size: clamp(28px, 5vw, 40px);
                font-weight: 700;
                line-height: 1.15;
            }

            p {
                margin: 18px 0 0;
                color: var(--ink-soft);
                font-size: 18px;
                max-width: 50ch;
            }

            .links {
                margin-top: 32px;
                display: flex;
                gap: 20px;
                font-size: 18px;
            }

            footer {
                padding: 40px 0 60px;
                color: var(--ink-soft);
                font-size: 14px;
            }

            footer p {
                margin: 0;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="wrap">
                <div class="site-name"><a href="/">Mobolu</a></div>
            </div>
        </header>

        <main>
            <div class="wrap">
                <div class="code">404</div>
                <h1>This page doesn't exist.</h1>
                <p>The link may be broken, or the page may have moved. Head back home to find what you were looking for.</p>
                <div class="links">
                    <a href="/">Back to home</a>
                    <a href="/#contact">Get in touch</a>
                </div>
            </div>
        </main>

        <footer>
            <div class="wrap">
                <p>© 2026 Mobolu Olowoyeye</p>
            </div>
        </footer>
    </body>
</html>
